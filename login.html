<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Iniciar Sesión - UrbanPlast</title>
	<style>
		/* ...estilos mínimos... */
		body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
		.card{background:white;padding:24px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);width:320px}
		h1{font-size:20px;margin-bottom:12px}
		.form-group{margin-bottom:12px}
		input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px}
		button{width:100%;padding:10px;background:#4A7B3F;color:#fff;border:none;border-radius:6px;cursor:pointer}
		.link{margin-top:10px;text-align:center;font-size:14px}
	</style>
</head>
<body>
	<div class="card">
		<h1>Iniciar Sesión</h1>
		<form id="loginForm">
			<div class="form-group">
				<input id="email" type="email" placeholder="Email" required>
			</div>
			<div class="form-group">
				<input id="password" type="password" placeholder="Contraseña" required>
			</div>
			<button type="submit">Entrar</button>
		</form>
		<div class="link">
			<a href="/register.html">¿No tienes cuenta? Registrarse</a>
		</div>
	</div>

	<script>
		const API_BASE = 'http://localhost:3000/api';
		document.getElementById('loginForm').addEventListener('submit', async (e) => {
			e.preventDefault();
			const email = document.getElementById('email').value;
			const password = document.getElementById('password').value;
			try {
				const res = await fetch(`${API_BASE}/login`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email, password })
				});
				const data = await res.json();
				if (res.ok) {
					localStorage.setItem('authToken', data.token);
					alert('Inicio de sesión correcto');
					window.location.href = '/main2.html';
				} else {
					alert(data.error || 'Error al iniciar sesión');
				}
			} catch (err) {
				console.error(err);
				alert('Error de conexión al servidor');
			}
		});
	</script>
</body>
</html>
