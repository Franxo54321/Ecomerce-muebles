<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Registrarse - UrbanPlast</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
		.card{background:white;padding:28px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.1);width:360px}
		h1{font-size:20px;margin-bottom:6px}
		.subtitle{font-size:13px;color:#888;margin-bottom:16px}
		.form-group{margin-bottom:12px}
		label{font-size:13px;color:#555;display:block;margin-bottom:4px}
		input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;font-size:14px}
		input:focus{outline:2px solid #4A7B3F;border-color:transparent}
		button{width:100%;padding:11px;background:#4A7B3F;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px;font-weight:600}
		button:hover{background:#3d6a35}
		button:disabled{background:#aaa;cursor:not-allowed}
		.link{margin-top:12px;text-align:center;font-size:13px}
		.link a{color:#4A7B3F;text-decoration:none}
		.msg{padding:10px;border-radius:6px;margin-bottom:12px;font-size:13px;display:none}
		.msg.error{background:#fdecea;color:#c0392b;display:block}
		.msg.success{background:#eafaf1;color:#1a6635;display:block}
		.code-hint{font-size:12px;color:#888;margin-top:6px;text-align:center}
		.code-input{letter-spacing:8px;font-size:22px;text-align:center;font-weight:700}
	</style>
</head>
<body>
	<div class="card">
		<!-- PASO 1: Formulario de registro -->
		<div id="step1">
			<h1>Crear Cuenta</h1>
			<p class="subtitle">Recibirás un código de verificación en tu correo.</p>
			<div id="msg1" class="msg"></div>
			<form id="registerForm">
				<div class="form-group"><label>Nombre</label><input id="name" placeholder="Tu nombre completo" required></div>
				<div class="form-group"><label>Email</label><input id="email" type="email" placeholder="correo@ejemplo.com" required></div>
				<div class="form-group"><label>Contraseña</label><input id="password" type="password" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
				<div class="form-group"><label>Confirmar contraseña</label><input id="confirm" type="password" placeholder="Repite la contraseña" required></div>
				<button type="submit" id="btnRegister">Registrarse</button>
			</form>
			<div class="link"><a href="/login.html">¿Ya tienes cuenta? Iniciar sesión</a></div>
		</div>

		<!-- PASO 2: Verificación de código -->
		<div id="step2" style="display:none">
			<h1>Verificar Correo</h1>
			<p id="step2Subtitle" class="subtitle">Ingresa el código de 6 dígitos enviado a tu correo.</p>
			<div id="msg2" class="msg"></div>
			<form id="verifyForm">
				<div class="form-group">
					<label>Código de verificación</label>
					<input id="code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
					<p class="code-hint">Expira en 15 minutos. Revisa también spam.</p>
				</div>
				<button type="submit" id="btnVerify">Verificar y crear cuenta</button>
			</form>
			<div class="link" style="margin-top:14px">
				<a href="#" id="resendLink">Reenviar código</a> ·
				<a href="/register.html">Volver al registro</a>
			</div>
		</div>
	</div>

	<script>
		const API_BASE = window.location.origin + '/api';
		let pendingEmail = '';

		function showMsg(stepNum, text, type) {
			const el = document.getElementById('msg' + stepNum);
			el.textContent = text;
			el.className = 'msg ' + type;
		}

		// --- PASO 1: Registrar ---
		document.getElementById('registerForm').addEventListener('submit', async (e) => {
			e.preventDefault();
			const name = document.getElementById('name').value.trim();
			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;
			const confirm = document.getElementById('confirm').value;

			if (password !== confirm) { showMsg(1, 'Las contraseñas no coinciden.', 'error'); return; }
			if (password.length < 6) { showMsg(1, 'La contraseña debe tener al menos 6 caracteres.', 'error'); return; }

			const btn = document.getElementById('btnRegister');
			btn.disabled = true;
			btn.textContent = 'Enviando código...';

			try {
				const res = await fetch(`${API_BASE}/register`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, email, password })
				});
				const data = await res.json();
				btn.disabled = false;
				btn.textContent = 'Registrarse';

				if (res.ok && data.needsVerification) {
					pendingEmail = email;
					document.getElementById('step1').style.display = 'none';
					document.getElementById('step2').style.display = 'block';
					document.getElementById('step2Subtitle').textContent =
						`Se envió un código a ${email}. Ingrésalo abajo.`;
					// En desarrollo el código viene en la respuesta
					if (data.devCode) {
						showMsg(2, `[Modo desarrollo] Código: ${data.devCode}. Configura EMAIL_USER/EMAIL_PASS para envío real.`, 'success');
					} else {
						showMsg(2, data.message || 'Revisa tu bandeja de entrada.', 'success');
					}
				} else {
					showMsg(1, data.error || 'Error al registrarse', 'error');
				}
			} catch (err) {
				console.error(err);
				btn.disabled = false;
				btn.textContent = 'Registrarse';
				showMsg(1, 'Error de conexión con el servidor.', 'error');
			}
		});

		// --- PASO 2: Verificar código ---
		document.getElementById('verifyForm').addEventListener('submit', async (e) => {
			e.preventDefault();
			const code = document.getElementById('code').value.trim();
			const btn = document.getElementById('btnVerify');
			btn.disabled = true;
			btn.textContent = 'Verificando...';

			try {
				const res = await fetch(`${API_BASE}/verify-email`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email: pendingEmail, code })
				});
				const data = await res.json();
				btn.disabled = false;
				btn.textContent = 'Verificar y crear cuenta';

				if (res.ok) {
					localStorage.setItem('authToken', data.token);
					showMsg(2, '¡Cuenta creada! Redirigiendo...', 'success');
					setTimeout(() => { window.location.href = '/main2.html'; }, 1200);
				} else {
					showMsg(2, data.error || 'Código incorrecto. Intenta de nuevo.', 'error');
				}
			} catch (err) {
				console.error(err);
				btn.disabled = false;
				btn.textContent = 'Verificar y crear cuenta';
				showMsg(2, 'Error de conexión con el servidor.', 'error');
			}
		});

		// --- Reenviar código ---
		document.getElementById('resendLink').addEventListener('click', async (e) => {
			e.preventDefault();
			if (!pendingEmail) { window.location.href = '/register.html'; return; }
			showMsg(2, 'Reenviando código...', 'success');
			try {
				// No hay endpoint dedicado de reenvío; volvemos a hacer register con los mismos datos
				// Redirigir al paso 1 para que el usuario lo haga de nuevo
				showMsg(2, 'Para reenviar el código, vuelve al formulario de registro.', 'success');
			} catch (err) { console.error(err); }
		});
	</script>
</body>
</html>
