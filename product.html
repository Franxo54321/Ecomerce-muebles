<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Producto - UrbanPlast</title>
  <link rel="stylesheet" href="css/main2.css">
  <style>
    /* ===== Página de producto — alineada con main2 ===== */
    .product-wrap { width:90%; max-width:1200px; margin:0 auto; padding:30px 0 60px; }
    .breadcrumbs { font-size:13px; color:#888; margin-bottom:20px; }
    .breadcrumbs a { color:var(--accent-color); text-decoration:none; }
    .breadcrumbs a:hover { text-decoration:underline; }

    .product-layout {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:40px;
      align-items:start;
    }

    /* Galería */
    .gallery { display:flex; flex-direction:column; gap:12px; }
    .gallery .main-img-box {
      width:100%; aspect-ratio:1/1; background:#fff; border-radius:12px;
      overflow:hidden; display:flex; align-items:center; justify-content:center;
      border:1px solid var(--neutral-color);
    }
    .gallery .main-img-box img {
      width:100%; height:100%; object-fit:contain; display:block;
    }
    .gallery .thumbs-row {
      display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    }
    .gallery .thumb {
      width:72px; height:72px; border-radius:8px; overflow:hidden;
      border:2px solid transparent; cursor:pointer; flex-shrink:0;
      background:#fff;
    }
    .gallery .thumb.active { border-color:var(--accent-color); }
    .gallery .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .gallery .nav-row {
      display:flex; gap:8px; justify-content:center;
    }
    .gallery .nav-row button {
      background:var(--primary-color); color:#fff; border:none; border-radius:6px;
      padding:8px 16px; cursor:pointer; font-size:14px; transition:background .2s;
    }
    .gallery .nav-row button:hover { background:var(--accent-color); }

    /* Info del producto */
    .product-info-panel { display:flex; flex-direction:column; gap:16px; }
    .product-info-panel .p-title {
      font-size:28px; font-weight:700; color:var(--primary-color); margin:0;
    }
    .product-info-panel .p-category {
      display:inline-block; background:var(--accent-color); color:#fff;
      padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600;
      text-transform:uppercase; letter-spacing:0.5px;
    }
    .product-info-panel .p-price {
      font-size:32px; font-weight:800; color:var(--primary-color); margin:0;
    }
    .product-info-panel .p-desc {
      color:#666; font-size:15px; line-height:1.7;
    }
    .product-info-panel .p-stock {
      font-size:14px; font-weight:600;
    }
    .p-stock.in-stock { color:var(--accent-color); }
    .p-stock.no-stock { color:#c0392b; }

    .product-info-panel .p-material {
      font-size:14px; color:#666;
    }

    /* Selector de color */
    .color-selector { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .color-selector label { font-weight:600; font-size:14px; margin-right:4px; }
    .color-chip {
      padding:6px 14px; border:2px solid var(--neutral-color); border-radius:20px;
      cursor:pointer; font-size:13px; background:#fff; transition:all .2s;
    }
    .color-chip.selected { border-color:var(--accent-color); background:var(--accent-color); color:#fff; }

    /* Cantidad y botón */
    .qty-add-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .qty-box {
      display:flex; align-items:center; border:1px solid var(--neutral-color);
      border-radius:8px; overflow:hidden;
    }
    .qty-box button {
      width:40px; height:44px; border:none; background:#fff; font-size:18px;
      cursor:pointer; transition:background .2s;
    }
    .qty-box button:hover { background:var(--light-color); }
    .qty-box input {
      width:50px; height:44px; text-align:center; border:none;
      border-left:1px solid var(--neutral-color);
      border-right:1px solid var(--neutral-color);
      font-size:16px; font-weight:600;
    }
    .add-cart-btn {
      flex:1; min-width:200px; padding:14px 24px; border:none; border-radius:8px;
      background:var(--accent-color); color:#fff; font-size:16px; font-weight:700;
      cursor:pointer; transition:background .2s; display:flex; align-items:center;
      justify-content:center; gap:8px;
    }
    .add-cart-btn:hover { background:#3D6534; }

    /* Características */
    .features-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;
    }
    .feature-tag {
      display:flex; align-items:center; gap:6px; font-size:13px; color:#555;
    }
    .feature-tag::before { content:"✓"; color:var(--accent-color); font-weight:700; }

    /* Modal carrito */
    .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); z-index:1000; }
    .modal.show { display:flex; }
    .modal-content {
      background:#fff; border-radius:12px; width:90%; max-width:600px;
      max-height:80vh; overflow:auto; padding:24px;
      box-shadow:0 20px 60px rgba(0,0,0,0.2);
    }
    .cart-item {
      display:flex; justify-content:space-between; gap:12px; padding:12px 0;
      border-bottom:1px solid #eee; align-items:center;
    }
    .cart-item img { width:56px; height:56px; object-fit:cover; border-radius:8px; }
    .btn-small { padding:6px 12px; border-radius:6px; border:none; cursor:pointer; background:#eee; font-size:13px; }
    .btn-small:hover { background:#ddd; }

    /* Responsive */
    @media (max-width: 768px) {
      .product-layout { grid-template-columns:1fr; gap:24px; }
      .product-info-panel .p-title { font-size:22px; }
      .product-info-panel .p-price { font-size:26px; }
    }
  </style>
</head>
<body>
  <!-- Header (igual que main2.html) -->
  <header>
    <div class="container header-content">
      <a href="/" class="logo">Urban<span>Plast</span></a>
      <nav>
        <ul>
          <li><a href="/">Inicio</a></li>
          <li><a href="/productos.html">Productos</a></li>
          <li><a href="/#about">Nosotros</a></li>
          <li><a href="/#contact">Contacto</a></li>
          <li id="auth-buttons" class="auth-buttons">
            <a id="loginLink" class="auth-btn login-btn" href="/login.html">Iniciar Sesión</a>
            <a id="registerLink" class="auth-btn register-btn" href="/register.html">Registrarse</a>
          </li>
          <li id="user-menu" class="user-menu" style="display:none;">
            <span class="user-greeting" id="userGreeting"></span>
            <a href="/admin" id="adminLink" class="auth-btn login-btn" style="display:none;padding:6px 12px;font-size:13px;">Admin</a>
            <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
          </li>
          <li class="cart-icon" onclick="openCart()">
            🛒 <span id="cartCount" class="cart-count">0</span>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="product-wrap">
    <div class="breadcrumbs">
      <a href="/">Inicio</a> · <a href="/productos.html">Productos</a> · <span id="crumb-name">Cargando...</span>
    </div>

    <div id="productArea" class="product-layout">
      <!-- Galería -->
      <div class="gallery">
        <div class="main-img-box">
          <img id="mainImage" src="/img/default.png" alt="imagen producto">
        </div>
        <div class="thumbs-row" id="thumbs"></div>
        <div class="nav-row">
          <button id="prevBtn">◀ Anterior</button>
          <button id="nextBtn">Siguiente ▶</button>
        </div>
      </div>

      <!-- Detalles -->
      <div class="product-info-panel">
        <span class="p-category" id="productCategory">—</span>
        <h1 class="p-title" id="productName">Cargando...</h1>
        <div class="p-price" id="productPrice">$0.00</div>
        <div class="p-stock" id="productStock">—</div>
        <p class="p-desc" id="productDesc">—</p>
        <div class="p-material" id="productMaterial"></div>

        <div id="featuresArea" style="display:none">
          <span style="font-weight:600;font-size:14px;">Características:</span>
          <div class="features-grid" id="featuresGrid"></div>
        </div>

        <div class="color-selector" id="colorSelector">
          <label>Color:</label>
        </div>

        <div class="qty-add-row">
          <div class="qty-box">
            <button type="button" id="qtyMinus">−</button>
            <input id="qtyInput" type="number" value="1" min="1" />
            <button type="button" id="qtyPlus">+</button>
          </div>
          <button id="addToCartBtn" class="add-cart-btn">🛒 Agregar al carrito</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Carrito -->
  <div id="cartModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="margin:0;">Tu Carrito</h3>
        <button onclick="closeCart()" class="btn-small">✕ Cerrar</button>
      </div>
      <div id="cartModalItems"></div>
      <div id="cartModalTotal" style="margin-top:16px;font-weight:700;font-size:18px;">Total: $0.00</div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
        <button id="checkoutBtn" class="add-cart-btn" style="min-width:unset;">Finalizar compra</button>
      </div>
    </div>
  </div>

<script>
  const API_BASE = window.location.origin + '/api';
  function qsParam(n){ return new URLSearchParams(location.search).get(n); }

  let images = [];
  let currentIndex = 0;
  let productData = null;
  let selectedColor = '';

  // ===== Local cart =====
  function readLocalCart(){
    try{ return JSON.parse(localStorage.getItem('cart')) || []; }catch(e){ return []; }
  }
  function writeLocalCart(cart){
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCountUI();
  }
  function updateCartCountUI(){
    const cart = readLocalCart();
    const count = cart.reduce((s,i)=> s + (i.quantity||0), 0);
    document.getElementById('cartCount').textContent = count;
  }

  async function addToServerCart(token, productId, quantity){
    try{
      const res = await fetch(`${API_BASE}/cart`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ productId, quantity })
      });
      return res.ok;
    }catch(e){ return false; }
  }

  // ===== Cargar producto =====
  async function loadProduct(){
    const id = qsParam('id');
    if(!id){ document.getElementById('productArea').innerHTML = '<p style="text-align:center;padding:40px;">ID de producto no especificado.</p>'; return; }
    try{
      const res = await fetch(`${API_BASE}/products/${id}`);
      if(!res.ok){ document.getElementById('productArea').innerHTML = `<p style="text-align:center;padding:40px;">Error ${res.status}</p>`; return; }
      productData = await res.json();
      images = (productData.images && productData.images.length) ? productData.images.slice() : [productData.image || '/img/default.png'];
      currentIndex = 0;
      renderGallery();
      renderDetails();
      updateCartCountUI();
    }catch(err){
      console.error(err);
      document.getElementById('productArea').innerHTML = '<p style="text-align:center;padding:40px;">Error de conexión al servidor</p>';
    }
  }

  // ===== Galería =====
  function renderGallery(){
    const thumbsEl = document.getElementById('thumbs');
    thumbsEl.innerHTML = '';
    images.forEach((src, idx) => {
      const d = document.createElement('div');
      d.className = 'thumb' + (idx===currentIndex ? ' active' : '');
      d.innerHTML = `<img src="${src}" alt="thumb-${idx}" onerror="this.src='/img/default.png'">`;
      d.addEventListener('click', ()=>{ currentIndex = idx; updateMain(); });
      thumbsEl.appendChild(d);
    });
    // Ocultar nav si solo hay 1 imagen
    document.querySelector('.nav-row').style.display = images.length > 1 ? 'flex' : 'none';
    updateMain();
  }

  function updateMain(){
    document.getElementById('mainImage').src = images[currentIndex] || '/img/default.png';
    document.querySelectorAll('.thumb').forEach((el, i)=> el.classList.toggle('active', i===currentIndex));
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(images.length<2) return;
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateMain();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(images.length<2) return;
    currentIndex = (currentIndex + 1) % images.length;
    updateMain();
  });

  // ===== Renderizar detalles =====
  function renderDetails(){
    document.getElementById('productName').textContent = productData.name;
    document.getElementById('crumb-name').textContent = productData.name;
    document.getElementById('productCategory').textContent = productData.category || '';
    document.getElementById('productPrice').textContent = `$${(productData.price||0).toFixed(2)}`;
    document.getElementById('productDesc').textContent = productData.description || '';

    const stockEl = document.getElementById('productStock');
    if (productData.stock > 0) {
      stockEl.textContent = `✓ ${productData.stock} unidades disponibles`;
      stockEl.className = 'p-stock in-stock';
    } else {
      stockEl.textContent = '✗ Sin stock';
      stockEl.className = 'p-stock no-stock';
    }

    document.getElementById('productMaterial').innerHTML = productData.material ? `<strong>Material:</strong> ${productData.material}` : '';

    // Características
    if (productData.features && productData.features.length) {
      document.getElementById('featuresArea').style.display = 'block';
      document.getElementById('featuresGrid').innerHTML = productData.features.map(f => `<div class="feature-tag">${f}</div>`).join('');
    }

    // Colores
    const colorSel = document.getElementById('colorSelector');
    const colors = (productData.colors && productData.colors.length) ? productData.colors : [];
    if (colors.length === 0) {
      colorSel.style.display = 'none';
    } else {
      colorSel.innerHTML = '<label>Color:</label>';
      colors.forEach((c, i) => {
        const chip = document.createElement('span');
        chip.className = 'color-chip' + (i === 0 ? ' selected' : '');
        chip.textContent = c;
        chip.addEventListener('click', () => {
          document.querySelectorAll('.color-chip').forEach(el => el.classList.remove('selected'));
          chip.classList.add('selected');
          selectedColor = c;
        });
        colorSel.appendChild(chip);
      });
      selectedColor = colors[0];
    }
  }

  // Cantidad
  const qtyInput = document.getElementById('qtyInput');
  document.getElementById('qtyMinus').addEventListener('click', ()=> { qtyInput.value = Math.max(1, parseInt(qtyInput.value||'1')-1); });
  document.getElementById('qtyPlus').addEventListener('click', ()=> { qtyInput.value = Math.max(1, parseInt(qtyInput.value||'1')+1); });

  // Agregar al carrito
  document.getElementById('addToCartBtn').addEventListener('click', async ()=>{
    const color = selectedColor;
    const qty = Math.max(1, parseInt(qtyInput.value||'1'));
    if(!productData) return;

    const cart = readLocalCart();
    const existingIdx = cart.findIndex(i => i.productId === productData._id && i.color === color);
    if(existingIdx > -1){
      cart[existingIdx].quantity += qty;
    } else {
      cart.push({
        productId: productData._id,
        name: productData.name,
        price: productData.price || 0,
        image: images[0] || '',
        color,
        quantity: qty
      });
    }
    writeLocalCart(cart);

    const token = localStorage.getItem('authToken');
    if(token) await addToServerCart(token, productData._id, qty);

    // Feedback visual
    const btn = document.getElementById('addToCartBtn');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Agregado';
    btn.style.background = '#27ae60';
    setTimeout(()=>{ btn.innerHTML = orig; btn.style.background = ''; }, 1500);
  });

  // ===== Auth UI =====
  async function checkAuthStatus() {
    const token = localStorage.getItem('authToken');
    if (!token) { updateAuthUI(null); return; }
    try {
      const res = await fetch(`${API_BASE}/me`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) { updateAuthUI(null); return; }
      const data = await res.json();
      updateAuthUI(data.user);
    } catch (err) { updateAuthUI(null); }
  }

  function updateAuthUI(user) {
    const authBtns = document.getElementById('auth-buttons');
    const userMenu = document.getElementById('user-menu');
    const adminLink = document.getElementById('adminLink');

    if (user) {
      authBtns.style.display = 'none';
      userMenu.style.display = 'flex';
      document.getElementById('userGreeting').textContent = `Hola, ${user.name}`;
      adminLink.style.display = (user.role === 'admin') ? 'inline' : 'none';
    } else {
      authBtns.style.display = 'flex';
      userMenu.style.display = 'none';
      adminLink.style.display = 'none';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('authToken');
    updateAuthUI(null);
  });

  // ===== Carrito modal =====
  function openCart(){
    updateCartModal();
    document.getElementById('cartModal').classList.add('show');
  }
  function closeCart(){
    document.getElementById('cartModal').classList.remove('show');
  }

  function updateCartModal(){
    const itemsEl = document.getElementById('cartModalItems');
    const totalEl = document.getElementById('cartModalTotal');
    const cart = readLocalCart();
    itemsEl.innerHTML = '';
    if (cart.length === 0) {
      itemsEl.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">Tu carrito está vacío.</p>';
      totalEl.textContent = 'Total: $0.00';
      document.getElementById('checkoutBtn').disabled = true;
      return;
    }
    let total = 0;
    cart.forEach((it, idx) => {
      const itemTotal = (it.price || 0) * (it.quantity || 0);
      total += itemTotal;
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <div style="display:flex;gap:12px;align-items:center">
          <img src="${it.image || '/img/default.png'}" alt="${it.name}">
          <div>
            <div style="font-weight:700">${it.name}</div>
            <div style="font-size:13px;color:#666">${it.color ? 'Color: '+it.color+' · ' : ''}Cant: ${it.quantity}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div style="font-weight:700">$${itemTotal.toFixed(2)}</div>
          <button class="btn-small" onclick="removeFromLocalCart(${idx})">🗑</button>
        </div>`;
      itemsEl.appendChild(div);
    });
    totalEl.textContent = `Total: $${total.toFixed(2)}`;
    document.getElementById('checkoutBtn').disabled = false;
  }

  function removeFromLocalCart(index){
    const cart = readLocalCart();
    if (index >=0 && index < cart.length) { cart.splice(index,1); writeLocalCart(cart); updateCartModal(); }
  }

  // Checkout con MercadoPago
  document.getElementById('checkoutBtn').addEventListener('click', async () => {
    const token = localStorage.getItem('authToken');
    const cart = readLocalCart();
    if (cart.length === 0) return;
    if (!token) { alert('Por favor inicia sesión para finalizar compra'); window.location.href = '/login.html'; return; }

    try {
      const res = await fetch(`${API_BASE}/create-preference`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          cart: cart.map(i => ({ productId: i.productId, quantity: i.quantity, price: i.price, name: i.name })),
          shippingAddress: {}
        })
      });
      const data = await res.json();
      if (res.ok && data.init_point) {
        window.location.href = data.init_point;
      } else {
        alert(data.error || 'Error al crear el pago');
      }
    } catch (err) {
      console.error(err);
      alert('Error de conexión al procesar la compra');
    }
  });

  // ===== Init =====
  (async function init(){
    await checkAuthStatus();
    updateCartCountUI();
    loadProduct();
  })();
</script>
</body>
</html>
